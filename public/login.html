<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Panel de Campaña</title>
<style>
  :root {
    --surface-1:      #ffffff;
    --page-plane:     #efe7d5;
    --text-primary:   #23281c;
    --text-secondary: #6b6555;
    --text-muted:     #948d79;
    --border:         rgba(35,40,28,.12);
    --accent:         #2f7d3f;
    --accent-text:    #1e5e2c;
    --critical:       #b0392f;
    --card-shadow:    0 1px 2px rgba(35,40,28,.05), 0 10px 28px -16px rgba(35,40,28,.22);
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1:      #1e2317;
      --page-plane:     #15170f;
      --text-primary:   #f3efe2;
      --text-secondary: #b7ad97;
      --text-muted:     #837a68;
      --border:         rgba(243,239,226,.12);
      --accent:         #4fae63;
      --accent-text:    #7fd191;
      --critical:       #e2685c;
      --card-shadow:    0 1px 2px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: var(--font-body);
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    padding: 32px 28px;
    margin: 20px;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .logo svg { width: 30px; height: 30px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; }
  .logo-text { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .logo-text small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
  h1 { font-size: 18px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(1.05); }
  .error {
    display: none;
    background: color-mix(in srgb, var(--critical) 12%, transparent);
    color: var(--critical);
    border: 1px solid color-mix(in srgb, var(--critical) 35%, transparent);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M4 20c0-8 5-15 16-16-1 11-8 16-16 16Z"/><path d="M4 20c3-5 7-9 12-12"/></svg>
      <div class="logo-text">DS Hnos<small>Panel de Campaña</small></div>
    </div>
    <h1>Ingresar</h1>
    <div class="error" id="errorBox"></div>
    <form id="loginForm">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Ingresar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando…';

      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ usuario, password }),
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        errorBox.textContent = data.error || 'Usuario o contraseña incorrectos';
        errorBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = 'No se pudo conectar con el servidor. Probá de nuevo.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
